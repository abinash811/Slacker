services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slacker
      POSTGRES_PASSWORD: slacker
      POSTGRES_DB: slacker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slacker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      # Always points at the compose-network Postgres, regardless of what
      # DATABASE_URL is set to in .env (which is for non-Docker local dev).
      DATABASE_URL: postgresql+psycopg://slacker:slacker@db:5432/slacker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Only does anything when SLACK_USE_SOCKET_MODE=true and real Slack
  # credentials are set in .env — lets you develop against Slack without
  # exposing a public HTTP URL (see docs/ARCHITECTURE.md / SLACK_SETUP.md).
  # Production should use the backend's HTTP /slack/events route instead.
  slack-listener:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://slacker:slacker@db:5432/slacker
    command: python -m app.slack.socket_mode
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
