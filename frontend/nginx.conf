server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Single-page app: any unmatched path falls back to index.html so
    # client-side routes (e.g. /tickets/42) work on a hard refresh.
    location / {
        try_files $uri /index.html;
    }
}
